<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantau Tokder</title>
<meta name="description" content="Pantauan kerja harian tim konten channel Tokder, Budidaya Cabe dan Harga Cabe Hari Ini.">
<link rel="icon" href="/tokderlogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
